<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>追加問題</title>
<style>
  :root {
    --bg: #0e1117;
    --bg-soft: #161b26;
    --card: #1b2230;
    --card-hover: #222b3d;
    --line: #2c3650;
    --text: #e7ecf5;
    --muted: #9aa6bd;
    --accent: #f2b955;
    --accent-soft: #6ea8ff;
    --answer: #ffd479;
    --answer-bg: rgba(242, 185, 85, 0.12);
    --ng: #ff8a8a;
  }

  * { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    background:
      radial-gradient(1100px 600px at 80% -10%, rgba(110, 168, 255, 0.10), transparent 60%),
      radial-gradient(900px 500px at -10% 10%, rgba(242, 185, 85, 0.08), transparent 55%),
      var(--bg);
    color: var(--text);
    font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", "Meiryo", system-ui, sans-serif;
    line-height: 1.8;
    letter-spacing: 0.02em;
    padding: 0 16px 96px;
  }

  .wrap {
    max-width: 760px;
    margin: 0 auto;
  }

  header.page {
    text-align: center;
    padding: 64px 0 40px;
  }

  header.page .eyebrow {
    font-size: 0.78rem;
    letter-spacing: 0.45em;
    color: var(--accent);
    margin: 0 0 14px;
    text-indent: 0.45em;
  }

  header.page h1 {
    font-size: clamp(1.9rem, 6vw, 2.8rem);
    margin: 0;
    font-weight: 800;
    letter-spacing: 0.08em;
  }

  header.page .story {
    color: var(--muted);
    font-size: 0.95rem;
    margin: 26px auto 0;
    max-width: 34em;
    word-break: auto-phrase;
  }
  header.page .story p { margin: 0 0 14px; }
  header.page .story .quote {
    color: var(--text);
    font-size: 1.05rem;
    font-weight: 700;
  }

  header.page ul.rules {
    display: inline-block;
    margin: 10px 0 0;
    padding: 12px 18px;
    list-style: none;
    text-align: left;
    font-size: 0.85rem;
    color: var(--muted);
    background: var(--bg-soft);
    border: 1px solid var(--line);
    border-radius: 10px;
  }

  .step {
    margin: 44px 0 0;
  }

  .step > h2 {
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: 1.35rem;
    letter-spacing: 0.12em;
    margin: 0 0 18px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--line);
  }

  .step > h2 .num {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 2.6em;
    padding: 2px 10px;
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    font-weight: 700;
    color: var(--bg);
    background: var(--accent);
    border-radius: 999px;
  }

  .step > .note {
    margin: -6px 0 14px;
    font-size: 0.85rem;
    color: var(--muted);
  }

  /* 問題用紙 */
  figure.sheet {
    margin: 14px 0;
  }
  figure.sheet a {
    display: block;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
    transition: border-color 0.2s ease;
  }
  figure.sheet a:hover,
  figure.sheet a:focus-visible {
    border-color: var(--accent-soft);
  }
  figure.sheet img {
    display: block;
    width: 100%;
    height: auto;
  }
  figure.sheet.portrait {
    max-width: 460px;
    margin-left: auto;
    margin-right: auto;
  }

  /* 解答欄 */
  form.answer-box {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 20px;
  }
  form.answer-box label {
    display: block;
    font-weight: 700;
    margin-bottom: 10px;
  }
  form.answer-box .row {
    display: flex;
    gap: 10px;
  }
  form.answer-box input {
    flex: 1;
    min-width: 0;
    font: inherit;
    font-size: 1.1rem;
    letter-spacing: 0.08em;
    color: var(--text);
    background: var(--bg-soft);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 14px;
    outline: none;
    transition: border-color 0.2s ease;
  }
  form.answer-box input:focus {
    border-color: var(--accent-soft);
  }
  form.answer-box button {
    flex: none;
    font: inherit;
    font-weight: 700;
    letter-spacing: 0.1em;
    color: var(--bg);
    background: var(--accent);
    border: none;
    border-radius: 10px;
    padding: 10px 20px;
    cursor: pointer;
    transition: opacity 0.2s ease;
  }
  form.answer-box button:hover { opacity: 0.9; }
  form.answer-box button:disabled {
    opacity: 0.5;
    cursor: default;
  }

  /* 不正解: 文章は出さず、揺らして枠を赤くするだけ */
  form.answer-box.ng { animation: shake 0.35s ease; }
  form.answer-box.ng input { border-color: var(--ng); }
  @keyframes shake {
    20%, 60% { transform: translateX(-6px); }
    40%, 80% { transform: translateX(6px); }
  }
  @media (prefers-reduced-motion: reduce) {
    form.answer-box.ng { animation: none; }
  }

  .noscript {
    margin: 12px 0 0;
    font-size: 0.9rem;
    color: var(--ng);
  }

  @media (max-width: 480px) {
    form.answer-box { padding: 16px; }
    form.answer-box .row { flex-direction: column; }
    form.answer-box button { padding: 12px 20px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="page">
    <p class="eyebrow">ADDITIONAL&nbsp;PROBLEM</p>
    <h1>追加問題</h1>
    <div class="story">
      <p>あなたは事件を解決し、報告書を提出した。<br>しかし、開発者が対消滅システムを削除する前、あなた達はふと思う。</p>
      <p class="quote">「もし自分たちがパソコンを出力すればどうなるのか？」</p>
      <p>そう思ったあなた達はパソコンを生成した。<br>データにアクセスするには、次の謎を解く必要があるようだ。</p>
    </div>
    <ul class="rules">
      <li>※メモの有無は謎解きに関係しない</li>
      <li>※この問題+対消滅システムの理解だけで解くことが可能</li>
      <li>※解答はひらがな</li>
    </ul>
  </header>

  <!-- ===================== 問題 ===================== -->
  <section class="step">
    <h2><span class="num">Q</span>問題</h2>
    <p class="note">画像をタップすると拡大して見られます。</p>

    <figure class="sheet">
      <a href="img/pr1.png" target="_blank" rel="noopener"><img src="img/pr1.png" width="860" height="613" alt="まとめ"></a>
    </figure>
    <figure class="sheet">
      <a href="img/pr2.png" target="_blank" rel="noopener"><img src="img/pr2.png" width="860" height="613" alt="問題A" loading="lazy"></a>
    </figure>
    <figure class="sheet">
      <a href="img/pr3.png" target="_blank" rel="noopener"><img src="img/pr3.png" width="860" height="613" alt="問題B" loading="lazy"></a>
    </figure>
    <figure class="sheet">
      <a href="img/pr4.png" target="_blank" rel="noopener"><img src="img/pr4.png" width="860" height="614" alt="問題C" loading="lazy"></a>
    </figure>
    <figure class="sheet">
      <a href="img/pr5.png" target="_blank" rel="noopener"><img src="img/pr5.png" width="860" height="614" alt="問題D" loading="lazy"></a>
    </figure>
    <figure class="sheet">
      <a href="img/pr6.png" target="_blank" rel="noopener"><img src="img/pr6.png" width="860" height="614" alt="問題E" loading="lazy"></a>
    </figure>
    <figure class="sheet">
      <a href="img/pr7.png" target="_blank" rel="noopener"><img src="img/pr7.png" width="860" height="613" alt="問題F" loading="lazy"></a>
    </figure>
  </section>

  <!-- ===================== 資料 ===================== -->
  <section class="step">
    <h2><span class="num">REF</span>資料</h2>

    <figure class="sheet portrait">
      <a href="img/system.png" target="_blank" rel="noopener"><img src="img/system.png" width="597" height="842" alt="対消滅システム 説明シート" loading="lazy"></a>
    </figure>
  </section>

  <!-- ===================== 解答 ===================== -->
  <section class="step">
    <h2><span class="num">ANS</span>解答</h2>

    <form class="answer-box" id="answer-form" autocomplete="off" novalidate>
      <label for="answer-input">答えをひらがなで入力してください</label>
      <div class="row">
        <input id="answer-input" type="text" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done">
        <button type="submit" id="answer-button">答え合わせ</button>
      </div>
      <noscript><p class="noscript">答え合わせには JavaScript を有効にしてください。</p></noscript>
    </form>
  </section>

</div>

<script>
(() => {
  // 答えそのものは埋め込まず、PBKDF2 (SHA-256) の結果だけを持つ
  const ITERATIONS = 300000;
  const SALT_CHECK = "0e8c021c75567e1e93d272fd85a8b82f";
  const SALT_PATH = "38eadd3214003ce0de85363ddf146c62";
  const SALT_KEY = "f394e3450f541412d191b978c5ff0c31";
  const ANSWER_HASH = "fccaade18c4d217a913bad8f318478f2c38c268cf55e24a1c6865c0d92bfdb4d";

  const form = document.getElementById("answer-form");
  const input = document.getElementById("answer-input");
  const button = document.getElementById("answer-button");

  // 全角/半角・カタカナ・空白・長音記号の表記ゆれを吸収する
  function normalize(s) {
    return s.normalize("NFKC")
      .replace(/\s+/g, "")
      .replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60))
      .replace(/[-‐-―−ｰ]/g, "ー")
      .toLowerCase();
  }

  async function pbkdf2Hex(text, salt) {
    const enc = new TextEncoder();
    const key = await crypto.subtle.importKey("raw", enc.encode(text), "PBKDF2", false, ["deriveBits"]);
    const bits = await crypto.subtle.deriveBits(
      { name: "PBKDF2", hash: "SHA-256", salt: enc.encode(salt), iterations: ITERATIONS },
      key,
      256
    );
    return Array.from(new Uint8Array(bits), b => b.toString(16).padStart(2, "0")).join("");
  }

  function fail() {
    form.classList.remove("ng");
    void form.offsetWidth;
    form.classList.add("ng");
    button.disabled = false;
  }

  // IME の変換確定の Enter で送信されないようにする
  input.addEventListener("keydown", e => {
    if (e.key === "Enter" && (e.isComposing || e.keyCode === 229)) e.preventDefault();
  });
  input.addEventListener("input", () => form.classList.remove("ng"));

  // 正解ページから戻ってきたときにボタンが押せないままにならないようにする
  window.addEventListener("pageshow", () => { button.disabled = false; });

  form.addEventListener("submit", async e => {
    e.preventDefault();
    const answer = normalize(input.value);
    if (!answer || button.disabled) return;

    button.disabled = true;
    try {
      if (await pbkdf2Hex(answer, SALT_CHECK) !== ANSWER_HASH) return fail();
      // 正解ページの場所と、その本文を復号する鍵も答えから導出するので、コードからは辿れない
      const slug = (await pbkdf2Hex(answer, SALT_PATH)).slice(0, 16);
      const key = await pbkdf2Hex(answer, SALT_KEY);
      location.href = "./" + slug + "/#" + key;
    } catch (err) {
      fail();
    }
  });
})();
</script>
</body>
</html>
