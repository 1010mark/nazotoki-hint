<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>追加問題 クリア</title>
<style>
  :root {
    --bg: #0e1117;
    --bg-soft: #161b26;
    --card: #1b2230;
    --line: #2c3650;
    --text: #e7ecf5;
    --muted: #9aa6bd;
    --accent: #f2b955;
    --accent-soft: #6ea8ff;
    --answer: #ffd479;
    --answer-bg: rgba(242, 185, 85, 0.12);
  }

  * { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    background:
      radial-gradient(1100px 600px at 80% -10%, rgba(110, 168, 255, 0.10), transparent 60%),
      radial-gradient(900px 500px at -10% 10%, rgba(242, 185, 85, 0.08), transparent 55%),
      var(--bg);
    color: var(--text);
    font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", "Meiryo", system-ui, sans-serif;
    line-height: 1.8;
    letter-spacing: 0.02em;
    padding: 0 16px 96px;
    min-height: 100vh;
  }

  main {
    max-width: 640px;
    margin: 0 auto;
    padding-top: 72px;
  }

  .story p {
    margin: 0 0 1.6em;
    line-height: 2.1;
    word-break: auto-phrase;
  }
  .story strong {
    color: var(--answer);
    font-weight: 700;
  }

  hr.divider {
    border: none;
    height: 1px;
    width: 120px;
    margin: 56px auto;
    background: var(--line);
  }

  .clear {
    text-align: center;
  }
  .clear .eyebrow {
    font-size: 0.78rem;
    letter-spacing: 0.45em;
    text-indent: 0.45em;
    color: var(--accent);
    margin: 0 0 10px;
  }
  .clear h1 {
    font-size: clamp(2.2rem, 9vw, 3.4rem);
    font-weight: 800;
    letter-spacing: 0.06em;
    line-height: 1.3;
    margin: 0;
  }
  .clear h1 span {
    color: var(--accent);
  }

  .submit {
    margin: 36px 0 0;
    padding: 18px 20px;
    text-align: left;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
  }
  .submit p { margin: 0; }
  .submit p + p { margin-top: 8px; }

  .answer {
    color: var(--answer);
    background: var(--answer-bg);
    border-radius: 6px;
    padding: 1px 7px;
    font-weight: 700;
    white-space: nowrap;
  }

  /* 復号後に少しずつ表示する */
  main.show > * {
    animation: rise 0.8s ease both;
  }
  main.show > :nth-child(2) { animation-delay: 0.5s; }
  main.show > :nth-child(3) { animation-delay: 0.8s; }
  @keyframes rise {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    main.show > * { animation: none; }
  }

  .noscript {
    color: var(--muted);
    text-align: center;
  }
</style>
</head>
<body>
<main id="content">
  <noscript><p class="noscript">表示には JavaScript を有効にしてください。</p></noscript>
</main>

<script>
(async () => {
  // 本文は答えから導出した鍵で AES-GCM 暗号化してある。鍵は追加問題ページから URL の # で渡される
  const IV = "GS5TjI0hXWB6qiBz";
  const DATA = "14hNkggRjXI+kzp9wH1XGLtp3cj/B9UBSBQkVZqF6dph8/z/HxK4uFeo5L6eWPrbn0yllyLUd08VBO9XObWJ3Q5fP5CE0O2Mj3RVTd0hg+FhEOzO0fiiNBxXFoOyrPlEkgd5Oid8WJBOiIzuGiYHJSaNLatElMI7UnQwscFWY4WZFjF+awChshMCSEdZs3Cav8nZg9wiOkz5lkP4JaeT+UFYxKkx2sUgeHHI2BcSEemVlV6ogyU/+O5XgU94JIzWZG0P9lI2RryoasNGAoJ0MEXVX30C9aDkiJzIE8S28Jh83Pknod8EC+G+grUvbsgZiRtoolT9FGwfadsYUC/uOpLb9doWI4Zhy+ekoLmb4GiaGgVnQrWYw7cxxyPhEKxk/5oIhVhagtR5ZtkdetaW9hrVMQZjlZKYxXDkO0SBEy5hlgiGoUM+U47kTn40xiMZjOT+Z753cmQg4PkUkkZn9x//wEXVJAw6ZUdUVGJmIt8RSzKL+fb0zHhRx7fCdyY2rA6az+PO9Vx7SEmvyHZ8G8H5SwA1BcwX1KKuqOfuvjjk5LPTdiTQFiZ1rYcB4cwOWb5q9sq6mw+e6wMWn/yztqkRrxIKNSJSIYWhv1U+WYdM8dJjGoDtI31xXiBEUVjCO0M3VStRNKj/bps8HuM0FPrHzNU+S+VdQK82kmzeiwnx602+d51tpuMZjdP/ty91tUj9ywVnHr7UdRLgDh9e1Y2ZNjJ/dbr1jWjUfstK1HmXpCZoqB0CFQ539lbuFItb9cTSeBv+vkzGMHoQvbxq9oVf23YdX54iBbL7coIR9DzA2wOkXoaEAVVjAThFLw9LksPhunvgsmsK6t7CjkMK8LQU5wTv0GUYnSdxV6I8E7Y8d89H16y255VGXTVpkU1DK5vhdbkUgfLneLAF0ktK0iBldvY6c+wnmDD0JlIar/3PbxdAWmPQT4JHPJhuXuYZzuHziGxqlLEMTddeFSo31OyTBdE5+aTMJd+/HdLgAd9wnvE/REHn+x1E6FzS3PM8Dx51KQQuSITPcnnCbYbaO+9TgeoEaf5M+Msrenl2SdXDZquWBoa1zgUv611RqRTjIKK7zRSV9azy5LkATG7xR/jDZE44MUm200ecX6FPFDEdwTf/ttxPT6f/uY3UQyXHhddXfTEIZYgMOhtMuBfrxfwoAQmvh0ucBUyYzkYpLdPlUAkfNqE3stIXLHJV5rpdvy0eh1bVThRnDCrR+7/s8hz0vxFtjtzo7LSYfiCMa8c9OGUbO8F+AIe1WT1VKwIRGc2vfNYgWEh3EqpmBg9cBy5LQxVIUo6WfGRVUJQLh0kGP7UblBUxp/s3KJ3NPAoSzeMcY/X4Nv+cQM9uCMn0HE7bQpAzFCqQpkrUX2CWRXf1swmfVefK4oSbVKPA3j5jJsK0RCjhhRUouiOhVG06Ij92s30pLMtYuHGAqX2+eNvp7yT1ra6L4RuepymVUM90qFJBNE6XgkDdXJrS3Fs5zVdX/X5vQXyr4vPJLMP2JeV/6RnPUZZySQzV3PdqcpBSU27JxDzskLbpl5p9x5+CK5oUxazJyyhVc5gZGRe1FxQIZ2ZAZCE+iULVbk2k2UIm/X1j5sQfpux9lvqsMnRCkeW0AZOK";

  // 鍵が無い・違う場合は追加問題ページへ戻す
  const back = () => location.replace("../");
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

  try {
    const hex = location.hash.slice(1);
    if (!/^[0-9a-f]{64}$/.test(hex)) return back();
    const raw = new Uint8Array(hex.match(/../g).map(h => parseInt(h, 16)));
    const key = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
    const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(IV) }, key, b64(DATA));
    const main = document.getElementById("content");
    main.innerHTML = new TextDecoder().decode(plain);
    main.classList.add("show");
  } catch (err) {
    back();
  }
})();
</script>
</body>
</html>
