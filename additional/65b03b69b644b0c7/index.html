<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>追加問題 クリア</title>
<style>
  :root {
    --bg: #0e1117;
    --bg-soft: #161b26;
    --card: #1b2230;
    --line: #2c3650;
    --text: #e7ecf5;
    --muted: #9aa6bd;
    --accent: #f2b955;
    --accent-soft: #6ea8ff;
    --answer: #ffd479;
    --answer-bg: rgba(242, 185, 85, 0.12);
  }

  * { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    background:
      radial-gradient(1100px 600px at 80% -10%, rgba(110, 168, 255, 0.10), transparent 60%),
      radial-gradient(900px 500px at -10% 10%, rgba(242, 185, 85, 0.08), transparent 55%),
      var(--bg);
    color: var(--text);
    font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", "Meiryo", system-ui, sans-serif;
    line-height: 1.8;
    letter-spacing: 0.02em;
    padding: 0 16px 96px;
    min-height: 100vh;
  }

  main {
    max-width: 640px;
    margin: 0 auto;
    padding-top: 72px;
  }

  .story p {
    margin: 0 0 1.6em;
    line-height: 2.1;
    word-break: auto-phrase;
  }
  .story strong {
    color: var(--answer);
    font-weight: 700;
  }

  hr.divider {
    border: none;
    height: 1px;
    width: 120px;
    margin: 56px auto;
    background: var(--line);
  }

  .clear {
    text-align: center;
  }
  .clear .eyebrow {
    font-size: 0.78rem;
    letter-spacing: 0.45em;
    text-indent: 0.45em;
    color: var(--accent);
    margin: 0 0 10px;
  }
  .clear h1 {
    font-size: clamp(2.2rem, 9vw, 3.4rem);
    font-weight: 800;
    letter-spacing: 0.06em;
    line-height: 1.3;
    margin: 0;
  }
  .clear h1 span {
    color: var(--accent);
  }

  .submit {
    margin: 36px 0 0;
    padding: 18px 20px;
    text-align: left;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
  }
  .submit p { margin: 0; }
  .submit p + p { margin-top: 8px; }

  .form-link {
    display: block;
    margin: 24px 0 0;
    font-size: 0.9rem;
    color: var(--accent-soft);
    word-break: break-all;
  }
  .form-link:hover { opacity: 0.85; }

  .answer {
    color: var(--answer);
    background: var(--answer-bg);
    border-radius: 6px;
    padding: 1px 7px;
    font-weight: 700;
    white-space: nowrap;
  }

  /* 復号後に少しずつ表示する */
  main.show > * {
    animation: rise 0.8s ease both;
  }
  main.show > :nth-child(2) { animation-delay: 0.5s; }
  main.show > :nth-child(3) { animation-delay: 0.8s; }
  @keyframes rise {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    main.show > * { animation: none; }
  }

  .noscript {
    color: var(--muted);
    text-align: center;
  }
</style>
</head>
<body>
<main id="content">
  <noscript><p class="noscript">表示には JavaScript を有効にしてください。</p></noscript>
</main>

<script>

";

  // 鍵が無い・違う場合は追加問題ページへ戻す
  const back = () => location.replace("../");
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

  try {
    const hex = location.hash.slice(1);
    if (!/^[0-9a-f]{64}$/.test(hex)) return back();
    const raw = new Uint8Array(hex.match(/../g).map(h => parseInt(h, 16)));
    const key = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
    const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(IV) }, key, b64(DATA));
    const main = document.getElementById("content");
    main.innerHTML = new TextDecoder().decode(plain);
    main.classList.add("show");
  } catch (err) {
    back();
  }
})();
</script>
</body>
</html>
